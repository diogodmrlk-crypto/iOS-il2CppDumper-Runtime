name: Build IL2Cpp Dumper Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'

      - name: Install ldid
        run: brew install ldid

      - name: Build Dylib
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          export THEOS_MAKE_PATH=$THEOS/makefiles
          export TARGET_CODESIGN=$(which ldid)
          make FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: IL2CppDumper-Dylib
          path: .theos/obj/arm64/*.dylib
